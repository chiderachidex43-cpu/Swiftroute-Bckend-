spring.application.name=backend 

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swiftroute}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=2700000
jwt.refresh-expiration=604800000

logging.level.org.springframework.security=DEBUG


# Package media upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Delivery OTP Configuration
delivery.otp.hash-secret=${OTP_HASH_SECRET}
delivery.otp.expiration-minutes=5
delivery.otp.max-attempts=5

# SwiftRoute Brevo Transactional Email
# Values are supplied through Render environment variables.