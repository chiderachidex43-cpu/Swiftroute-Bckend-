spring.application.name=backend 

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/swiftroute}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=2700000
jwt.refresh-expiration=604800000

logging.level.org.springframework.security=DEBUG


# Package media upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Delivery OTP Configuration
delivery.otp.hash-secret=${OTP_HASH_SECRET}
delivery.otp.expiration-minutes=5
delivery.otp.max-attempts=5

# SwiftRoute Automated Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:swiftroutenotification@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

swiftroute.mail.from=${MAIL_FROM:swiftroutenotification@gmail.com}
