# Isolated test database
spring.datasource.url=jdbc:h2:mem:swiftroute-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test-only database settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only secrets
jwt.secret=test-only-jwt-secret-for-swiftroute-automated-tests-2026
delivery.otp.hash-secret=test-only-otp-hash-secret-for-automated-tests

# Dummy email configuration for automated tests only
BREVO_API_KEY=test-brevo-api-key
BREVO_SENDER_EMAIL=swiftroute-test@example.com