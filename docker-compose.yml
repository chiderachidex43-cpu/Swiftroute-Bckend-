services:

  postgres:
    image: postgres:18
    container_name: swiftroute-postgres
    environment:
      POSTGRES_DB: swiftroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  backend:
    build: .
    container_name: swiftroute-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/swiftroute
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres